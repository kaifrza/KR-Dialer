name: Build KR-Dialer APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Setup Java
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Locate newest ZIP
      # ---------------------------------------------------------
      - name: Locate newest KR-Dialer ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for KR-Dialer ZIP files..."

          ZIP="$(
            git ls-files -z |
            tr '\0' '\n' |
            grep -Ei '\.zip$' |
            while IFS= read -r f; do
              printf '%s\t%s\n' \
                "$(git log -1 --format=%ct -- "$f")" \
                "$f"
            done |
            sort -rn |
            head -n 1 |
            cut -f2-
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No tracked ZIP file was found in the repository."
            exit 1
          fi

          echo "Selected ZIP:"
          echo "$ZIP"

          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 4. Extract ZIP
      # ---------------------------------------------------------
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.path }}"

          echo "Extracting:"
          echo "$ZIP"

          rm -rf _project
          mkdir -p _project

          unzip -q "$ZIP" -d _project

          echo ""
          echo "Searching for Android project..."

          if [ -f "_project/settings.gradle.kts" ]; then
            PROJECT_ROOT="_project"
          else
            PROJECT_ROOT="$(
              find _project \
                -maxdepth 4 \
                -type f \
                -name settings.gradle.kts \
                -print -quit |
              xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            echo "The uploaded ZIP does not appear to contain a valid Android project."
            exit 1
          fi

          echo ""
          echo "Android project root:"
          echo "$PROJECT_ROOT"

          # Required project files
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Required project files verified."

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project structure:"
          find "$PROJECT_ROOT" -maxdepth 4 -type f | sort | head -n 150

      # ---------------------------------------------------------
      # 5. Prepare Gradle wrapper
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found."
            echo "Installing Gradle temporarily..."

            sudo apt-get update -qq
            sudo apt-get install -y gradle

            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.13
          else
            echo "Gradle wrapper found."
          fi

          chmod +x ./gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ---------------------------------------------------------
      # 6. Setup Gradle
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------
      # 7. Validate Gradle project
      # ---------------------------------------------------------
      - name: Validate Gradle project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Gradle project..."

          ./gradlew tasks --no-daemon

      # ---------------------------------------------------------
      # 8. Run unit tests
      # ---------------------------------------------------------
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running unit tests..."

          ./gradlew testDebugUnitTest --no-daemon

      # ---------------------------------------------------------
      # 9. Run Android Lint
      # ---------------------------------------------------------
      - name: Run lint
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Android Lint..."

          ./gradlew lintDebug --no-daemon

      # ---------------------------------------------------------
      # 10. Build Debug APK
      # ---------------------------------------------------------
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building KR-Dialer APK..."

          ./gradlew assembleDebug --no-daemon

      # ---------------------------------------------------------
      # 11. Locate APK
      # ---------------------------------------------------------
      - name: Find APK
        id: apk
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 12. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR-Dialer-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_ROOT }}/${{ steps.apk.outputs.APK }}
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------
      # 13. Build summary
      # ---------------------------------------------------------
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "       KR-DIALER BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK artifact:"
          echo "KR-Dialer-APK-${{ github.run_number }}"
          echo ""
          echo "Build completed successfully."
