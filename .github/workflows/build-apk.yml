name: Build KR-Dialer APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. Find newest KR-Dialer ZIP
      # =========================================================
      - name: Locate newest KR-Dialer ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ZIP files..."

          ZIP="$(
            git ls-files -z |
            tr '\0' '\n' |
            grep -Ei '\.zip$' |
            while IFS= read -r f; do
              printf '%s\t%s\n' \
                "$(git log -1 --format=%ct -- "$f")" \
                "$f"
            done |
            sort -rn |
            head -n 1 |
            cut -f2-
          )"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Selected ZIP:"
          echo "$ZIP"

          echo "path=$ZIP" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 4. Extract ZIP
      # =========================================================
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.path }}"

          echo "Extracting:"
          echo "$ZIP"

          rm -rf _project
          mkdir -p _project

          unzip -q "$ZIP" -d _project

          echo ""
          echo "Searching for Android project..."

          if [ -f "_project/settings.gradle.kts" ]; then
            PROJECT_ROOT="_project"
          else
            PROJECT_ROOT="$(
              find _project \
                -maxdepth 4 \
                -type f \
                -name settings.gradle.kts \
                -print -quit |
              xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts not found."
            echo "The ZIP does not contain a valid Gradle Android project."
            exit 1
          fi

          echo ""
          echo "Android project root:"
          echo "$PROJECT_ROOT"

          # Required files
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Android project validation passed."

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 4 -type f |
            sort |
            head -n 150


      # =========================================================
      # 5. Install Gradle directly
      #
      # IMPORTANT:
      # We intentionally DO NOT generate/use gradlew here.
      # This avoids Gradle Wrapper JAR validation problems.
      # =========================================================
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Gradle 8.13..."

          sudo apt-get update -qq
          sudo apt-get install -y unzip wget

          GRADLE_VERSION="8.13"
          GRADLE_DIR="/opt/gradle/gradle-${GRADLE_VERSION}"

          if [ ! -d "$GRADLE_DIR" ]; then
            sudo mkdir -p /opt/gradle

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            sudo unzip -q \
              /tmp/gradle.zip \
              -d /opt/gradle

            rm -f /tmp/gradle.zip
          fi

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          export PATH="$GRADLE_DIR/bin:$PATH"

          echo ""
          echo "Gradle version:"
          gradle --version


      # =========================================================
      # 6. Configure Gradle environment
      # =========================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          echo "Gradle environment configured."


      # =========================================================
      # 7. Validate Gradle project
      # =========================================================
      - name: Validate Gradle project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Gradle validation..."

          gradle tasks --no-daemon


      # =========================================================
      # 8. Run unit tests
      # =========================================================
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running unit tests..."

          gradle testDebugUnitTest --no-daemon


      # =========================================================
      # 9. Run Android Lint
      # =========================================================
      - name: Run lint
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Android Lint..."

          gradle lintDebug --no-daemon


      # =========================================================
      # 10. Build Debug APK
      # =========================================================
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building KR-Dialer APK..."

          gradle assembleDebug --no-daemon


      # =========================================================
      # 11. Find generated APK
      # =========================================================
      - name: Find APK
        id: apk
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 12. Upload APK Artifact
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR-Dialer-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_ROOT }}/${{ steps.apk.outputs.APK }}
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # 13. Success summary
      # =========================================================
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       KR-DIALER BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK Artifact:"
          echo "KR-Dialer-APK-${{ github.run_number }}"
          echo ""
          echo "Build completed successfully."
