name: Build KR-Dialer APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate newest KR-Dialer ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            git ls-files -z |
            tr '\0' '\n' |
            grep -Ei '\.zip$' |
            while IFS= read -r f; do
              printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"
            done |
            sort -rn |
            head -n 1 |
            cut -f2-
          )"

          test -n "$ZIP"
          echo "Using ZIP: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.zip.outputs.path }}"

          rm -rf _project
          mkdir -p _project

          unzip -q "$ZIP" -d _project

          if [ -f "_project/settings.gradle.kts" ]; then
            PROJECT_ROOT="_project"
          else
            PROJECT_ROOT="$(
              find _project \
                -maxdepth 3 \
                -type f \
                -name settings.gradle.kts \
                -print -quit |
              xargs -r dirname
            )"
          fi

          test -n "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Extracted project:"
          find "$PROJECT_ROOT" -maxdepth 3 -type f |
            sort |
            head -n 100

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x ./gradlew ]; then
            echo "Gradle wrapper missing."
            echo "Installing Gradle temporarily..."

            sudo apt-get update -qq
            sudo apt-get install -y gradle

            gradle wrapper --gradle-version 8.13
          fi

          chmod +x ./gradlew

          ./gradlew --version

      - name: Validate project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew tasks --no-daemon

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        id: apk
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          test -n "$APK"

          echo "APK=$APK" >> "$GITHUB_OUTPUT"

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR-Dialer-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_ROOT }}/${{ steps.apk.outputs.APK }}
          if-no-files-found: error
          retention-days: 14
